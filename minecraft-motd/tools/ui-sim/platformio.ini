; PlatformIO native SDL2 simulator configuration (Linux / macOS / Windows MSYS2+SDL2)
; Run: pio run -e native -t exec
[env:native]
platform = native
build_type = debug
lib_extra_dirs = ../../lib
build_flags =
  -std=c++17
  -I../../lib/MinecraftMotd/src
  -I../../lib/MotdUi/src
  -DM5GFX_BOARD=board_M5StickS3
  -DM5GFX_SCALE=2
  -DM5GFX_ROTATION=1
  -lSDL2
lib_deps =
  m5stack/M5GFX @ ^0.2.26
  bblanchon/ArduinoJson @ ^7.4.3
