[project]
name = "minecraft-motd-host"
version = "1.0.0"
description = "StickS3 Minecraft MOTD 上位机配置工具"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5,<4"]

[project.scripts]
minecraft-motd = "motd_host.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motd_host"]
