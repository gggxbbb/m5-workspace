[project]
name = "liangzi-meter-host"
version = "0.1.0"
description = "liangzi-meter 上位机：通过串口为 StickS3 下发 WiFi/NTP/API Key/峰谷时段配置"
requires-python = ">=3.11"
dependencies = [
  "PyQt6>=6.7",
  "pyserial>=3.5",
]

[project.scripts]
liangzi-meter = "liangzi_meter.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liangzi_meter"]
